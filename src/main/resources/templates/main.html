<!DOCTYPE html>
<!--
    main.html - 首页
    使用：th:replace="~{layout :: layout(pageTitle='首页', currentPage='home', content=~{:: .page-content})}"
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(pageTitle='首页', currentPage='home', content=~{:: .page-content})}">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
</head>
<body>
    <div class="page-content">
        <div class="hero">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>
            <div class="hero-card">
                <div class="hero-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <h1 class="hero-title">欢迎进入系统</h1>
                <p class="hero-subtitle">感谢您的登录，当前会话已建立成功</p>
                <div class="hero-badges">
                    <span class="badge badge-primary">🔐 安全连接</span>
                    <span class="badge badge-success">✅ 已认证</span>
                    <span class="badge badge-warning">🚀 就绪状态</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
