<!DOCTYPE html>
<!--
    groupManage.html - 分组管理页面
    使用：th:replace="~{layout :: layout(pageTitle='分组管理', currentPage='groups', content=~{:: .page-content})}"
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(pageTitle='分组管理', currentPage='groups', content=~{:: .page-content})}">
<head>
    <meta charset="UTF-8">
    <title>分组管理</title>
</head>
<body>
    <div class="page-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="card">
            <div class="card-header">
                <h2>📂 分组管理</h2>
                <button class="btn btn-primary" onclick="showCreateModal()">➕ 创建分组</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>分组名称</th>
                        <th>描述</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="group : ${groups}">
                        <td th:text="${group.id}">1</td>
                        <td th:text="${group.name}">技术部</td>
                        <td th:text="${group.description != null ? group.description : '-'}">技术部门成员</td>
                        <td th:text="${#temporals.format(group.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                        <td>
                            <a th:href="@{/admin/group/{id}(id=${group.id})}" class="btn btn-secondary btn-sm">👥 成员</a>
                            <button type="button" class="btn btn-primary btn-sm"
                                th:attr="data-id=${group.id}, data-name=${group.name}, data-desc=${group.description != null ? group.description : ''}"
                                onclick="showEditModal(this)">✏️ 编辑</button>
                            <form th:action="@{/admin/group/delete/{id}(id=${group.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('确定要删除该分组吗？')">🗑️ 删除</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(groups)}">
                        <td colspan="5">
                            <div class="empty-state">
                                <div style="font-size: 60px; margin-bottom: 20px;">📂</div>
                                <p>暂无分组数据</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 创建分组模态框 -->
        <div id="createModal" class="modal-overlay">
            <div class="modal">
                <h3>创建分组</h3>
                <form th:action="@{/admin/group/create}" method="post">
                    <div class="form-group">
                        <label>分组名称 <span class="required">*</span></label>
                        <input type="text" name="name" required placeholder="请输入分组名称">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea name="description" placeholder="请输入分组描述（可选）"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="hideCreateModal()">取消</button>
                        <button type="submit" class="btn btn-primary">创建</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 编辑分组模态框 -->
        <div id="editModal" class="modal-overlay">
            <div class="modal">
                <h3>编辑分组</h3>
                <form th:action="@{/admin/group/update}" method="post">
                    <input type="hidden" id="editGroupId" name="id">
                    <div class="form-group">
                        <label>分组名称 <span class="required">*</span></label>
                        <input type="text" id="editGroupName" name="name" required placeholder="请输入分组名称">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="editGroupDesc" name="description" placeholder="请输入分组描述（可选）"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="hideEditModal()">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
