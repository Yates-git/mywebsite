<!DOCTYPE html>
<!--
    pageForm.html - 页面编辑表单
    使用：th:replace="~{layout :: layout(pageTitle='编辑页面', currentPage='permissions', content=~{:: .page-content})}"
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(pageTitle='编辑页面', currentPage='permissions', content=~{:: .page-content})}">
<head>
    <meta charset="UTF-8">
    <title>编辑页面</title>
</head>
<body>
    <div class="page-content">
        <div class="card">
            <h1>✏️ 编辑页面</h1>

            <form th:action="@{/admin/page/update}" method="post">
                <input type="hidden" name="id" th:value="${page.id}" />

                <div class="form-group">
                    <label>页面名称 <span class="required">*</span></label>
                    <input type="text" name="name" th:value="${page.name}" required placeholder="如：新闻页面">
                </div>

                <div class="form-group">
                    <label>页面路径 <span class="required">*</span></label>
                    <input type="text" name="path" th:value="${page.path}" required placeholder="如：/news" pattern="/.*">
                </div>

                <div class="form-group">
                    <label>排序（数字越小越靠前）</label>
                    <input type="number" name="sortOrder" th:value="${page.sortOrder}" value="99" placeholder="99">
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a th:href="@{/admin/permissions}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
