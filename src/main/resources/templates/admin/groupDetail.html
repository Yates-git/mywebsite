<!DOCTYPE html>
<!--
    groupDetail.html - 分组详情页面
    使用：th:replace="~{layout :: layout(pageTitle='分组详情', currentPage='groups', content=~{:: .page-content})}"
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(pageTitle='分组详情', currentPage='groups', content=~{:: .page-content})}">
<head>
    <meta charset="UTF-8">
    <title>分组详情</title>
    <style>
        .card-header h2 span { color: var(--link-color); }
    </style>
</head>
<body>
    <div class="page-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- 分组信息 -->
        <div class="card">
            <div class="card-header">
                <h2><span th:text="${group.name}">技术部</span> - 分组详情</h2>
                <a th:href="@{/admin/groups}" class="btn btn-secondary">← 返回分组列表</a>
            </div>
            <div class="info-group">
                <div class="info-item">
                    <div class="info-label">分组名称</div>
                    <div class="info-value" th:text="${group.name}">技术部</div>
                </div>
                <div class="info-item">
                    <div class="info-label">描述</div>
                    <div class="info-value" th:text="${group.description != null ? group.description : '-'}">技术部门成员</div>
                </div>
                <div class="info-item">
                    <div class="info-label">创建时间</div>
                    <div class="info-value" th:text="${#temporals.format(group.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</div>
                </div>
                <div class="info-item">
                    <div class="info-label">成员数量</div>
                    <div class="info-value" th:text="${members.size()}">5</div>
                </div>
            </div>
        </div>

        <!-- 成员列表 -->
        <div class="card">
            <div class="card-header">
                <h2>👥 分组成员 (<span th:text="${members.size()}">5</span>)</h2>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${members}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">user1</td>
                        <td>
                            <span class="role-tag admin" th:if="${user.isAdmin == 1}">管理员</span>
                            <span class="role-tag user" th:if="${user.isAdmin == 0}">普通用户</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/group/{groupId}/removeUser/{userId}(groupId=${group.id}, userId=${user.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('确定要将该用户移出分组吗？')">移出分组</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(members)}">
                        <td colspan="4">
                            <div class="empty-state">暂无成员</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 添加成员 -->
        <div class="card" th:if="${not #lists.isEmpty(otherUsers)}">
            <div class="card-header">
                <h2>➕ 添加成员</h2>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${otherUsers}">
                        <td th:text="${user.id}">10</td>
                        <td th:text="${user.username}">newuser</td>
                        <td>
                            <span class="role-tag admin" th:if="${user.isAdmin == 1}">管理员</span>
                            <span class="role-tag user" th:if="${user.isAdmin == 0}">普通用户</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/group/{id}/addUser(id=${group.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="userId" th:value="${user.id}">
                                <button type="submit" class="btn btn-primary btn-sm">添加到分组</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
