<!DOCTYPE html>
<!--
    统一布局 - 带左侧可展开导航栏 + 主题切换
    使用：th:replace="~{layout :: layout(pageTitle='xxx', currentPage='xxx', content=~{:: .page-content})}"
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, currentPage)">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="${faviconLink}" type="image/svg+xml">
    <title th:text="${pageTitle}">后台管理</title>
    <style>
        /* -------------------- 主题变量 -------------------- */
        :root {
            /* 浅色主题 */
            --bg-primary: #f5f6fa;
            --bg-card: #ffffff;
            --bg-sidebar: #2c3e50;
            --bg-header: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-sidebar: rgba(255,255,255,0.7);
            --text-sidebar-active: #ffffff;
            --border-color: #eeeeee;
            --shadow-card: 0 5px 20px rgba(0,0,0,0.05);
            --hover-bg: #f8f9fa;
            --link-color: #667eea;
            --link-hover: #5568d3;
            --btn-primary: #667eea;
            --btn-danger: #dc3545;
            --btn-success: #28a745;
            --btn-secondary: #6c757d;
            --role-admin-bg: #ffeaea;
            --role-admin-color: #e74c3c;
            --role-user-bg: #e8f5e9;
            --role-user-color: #27ae60;
            --status-active-bg: #e8f5e9;
            --status-active-color: #27ae60;
            --status-deleted-bg: #fce4ec;
            --status-deleted-color: #e91e63;
            --group-tag-bg: #e3f2fd;
            --group-tag-color: #1976d2;
            --alert-success-bg: #d4edda;
            --alert-success-color: #155724;
            --alert-error-bg: #f8d7da;
            --alert-error-color: #721c24;
            --alert-info-bg: #d1ecf1;
            --alert-info-color: #0c5460;
            --input-bg: #ffffff;
            --input-border: #dddddd;
            --table-header-bg: #f8f9fa;
            --toggle-btn-bg: #e9ecef;
            --toggle-btn-active: #667eea;
        }

        [data-theme="dark"] {
            /* 深色主题 */
            --bg-primary: #1a1a2e;
            --bg-card: #16213e;
            --bg-sidebar: #0f0f23;
            --bg-header: #16213e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-sidebar: rgba(255,255,255,0.6);
            --text-sidebar-active: #ffffff;
            --border-color: #2a2a4a;
            --shadow-card: 0 5px 20px rgba(0,0,0,0.3);
            --hover-bg: #1f2b47;
            --link-color: #8b9bf7;
            --link-hover: #a5b0fc;
            --btn-primary: #667eea;
            --btn-danger: #e74c3c;
            --btn-success: #27ae60;
            --btn-secondary: #5a6268;
            --role-admin-bg: #3d2020;
            --role-admin-color: #ff6b6b;
            --role-user-bg: #1a3d2e;
            --role-user-color: #6bff8b;
            --status-active-bg: #1a3d2e;
            --status-active-color: #6bff8b;
            --status-deleted-bg: #3d2020;
            --status-deleted-color: #ff6b6b;
            --group-tag-bg: #1a2d4a;
            --group-tag-color: #6b9fff;
            --alert-success-bg: #1a3d2e;
            --alert-success-color: #6bff8b;
            --alert-error-bg: #3d2020;
            --alert-error-color: #ff6b6b;
            --alert-info-bg: #1a2d4a;
            --alert-info-color: #6b9fff;
            --input-bg: #1a1a2e;
            --input-border: #3a3a5a;
            --table-header-bg: #1f2b47;
            --toggle-btn-bg: #2a2a4a;
            --toggle-btn-active: #8b9bf7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: var(--bg-primary); height: 100vh; overflow: hidden; color: var(--text-primary); transition: background 0.3s, color 0.3s; }

        /* -------------------- 整体布局 -------------------- */
        .layout { display: flex; height: 100vh; }

        /* -------------------- 左侧导航 -------------------- */
        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            color: var(--text-sidebar-active);
            display: flex;
            flex-direction: column;
            transition: width 0.3s, background 0.3s;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar.collapsed { width: 60px; }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 60px;
        }

        .sidebar-header .logo {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .sidebar.collapsed .logo { display: none; }

        .sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; }

        /* -------------------- 导航项 -------------------- */
        .nav-item { }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-link:hover { background: rgba(255,255,255,0.1); color: var(--text-sidebar-active); }
        .nav-link.active { background: rgba(255,255,255,0.15); color: var(--text-sidebar-active); }

        .nav-link .icon { font-size: 18px; width: 30px; flex-shrink: 0; text-align: center; }
        .nav-link .text { flex: 1; }
        .nav-link .arrow { font-size: 12px; transition: transform 0.2s; }

        .sidebar.collapsed .nav-link .text,
        .sidebar.collapsed .nav-link .arrow { display: none; }

        /* -------------------- 二级菜单 -------------------- */
        .submenu { display: none; background: rgba(0,0,0,0.2); }
        .submenu.open { display: block; }

        .submenu .nav-link {
            padding-left: 45px;
            font-size: 14px;
        }

        .submenu .nav-link .icon { width: 20px; }

        /* -------------------- 顶部栏 -------------------- */
        .header {
            height: 60px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .toggle-sidebar { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; color: var(--text-primary); }
        .header-title { font-size: 18px; color: var(--text-primary); font-weight: 500; }

        .header-right { display: flex; align-items: center; gap: 15px; }
        .header-user { color: var(--text-secondary); font-size: 14px; }
        .header-logout { background: var(--btn-danger); color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px; text-decoration: none; transition: background 0.3s; }
        .header-logout:hover { background: #c0392b; }

        /* -------------------- 主题切换按钮 -------------------- */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--toggle-btn-bg);
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: background 0.3s;
        }
        .theme-toggle:hover {
            background: var(--toggle-btn-active);
            color: white;
        }
        .theme-toggle-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        [data-theme="dark"] .theme-icon-light { display: none; }
        [data-theme="light"] .theme-icon-dark { display: none; }
        :root:not([data-theme]) .theme-icon-dark { display: none; }

        /* -------------------- 主内容区 -------------------- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: var(--bg-primary);
            transition: background 0.3s;
        }

        /* -------------------- 提示信息 -------------------- */
        .alert { padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: var(--alert-success-bg); color: var(--alert-success-color); border: 1px solid var(--alert-success-bg); }
        .alert-error { background: var(--alert-error-bg); color: var(--alert-error-color); border: 1px solid var(--alert-error-bg); }
        .alert-info { background: var(--alert-info-bg); color: var(--alert-info-color); border: 1px solid var(--alert-info-bg); }

        /* -------------------- 卡片 -------------------- */
        .card { background: var(--bg-card); border-radius: 10px; padding: 30px; box-shadow: var(--shadow-card); margin-bottom: 20px; transition: background 0.3s, box-shadow 0.3s; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); transition: border-color 0.3s; }
        .card-header h2 { color: var(--text-primary); font-size: 22px; }

        /* -------------------- 按钮 -------------------- */
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background: var(--btn-primary); color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-danger { background: var(--btn-danger); color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: var(--btn-secondary); color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-success { background: var(--btn-success); color: white; }
        .btn-success:hover { background: #218838; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* -------------------- 表格 -------------------- */
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); color: var(--text-primary); transition: border-color 0.3s; }
        .table th { background: var(--table-header-bg); color: var(--text-primary); font-weight: 600; transition: background 0.3s; }
        .table tr:hover { background: var(--hover-bg); }

        /* -------------------- 角色/状态标签 -------------------- */
        .role-tag { padding: 4px 10px; border-radius: 3px; font-size: 12px; font-weight: 500; }
        .role-tag.admin { background: var(--role-admin-bg); color: var(--role-admin-color); }
        .role-tag.user { background: var(--role-user-bg); color: var(--role-user-color); }
        .status-tag { padding: 4px 10px; border-radius: 3px; font-size: 12px; }
        .status-tag.active { background: var(--status-active-bg); color: var(--status-active-color); }
        .status-tag.deleted, .status-tag.disabled { background: var(--status-deleted-bg); color: var(--status-deleted-color); }

        /* -------------------- 分组标签 -------------------- */
        .group-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; background: var(--group-tag-bg); color: var(--group-tag-color); margin-right: 4px; transition: background 0.3s, color 0.3s; }

        /* -------------------- 空状态 -------------------- */
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state .icon { font-size: 60px; margin-bottom: 20px; }

        /* -------------------- 模态框 -------------------- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border-radius: 10px; padding: 30px; width: 450px; max-width: 90%; transition: background 0.3s; }
        .modal h3 { color: var(--text-primary); margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-primary); font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 15px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 14px; background: var(--input-bg); color: var(--text-primary); transition: border-color 0.3s, background 0.3s; }
        .form-group textarea { height: 80px; resize: vertical; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* -------------------- 页面信息 -------------------- */
        .info-group { display: flex; gap: 40px; margin-bottom: 20px; flex-wrap: wrap; }
        .info-item { }
        .info-label { color: var(--text-secondary); font-size: 14px; margin-bottom: 5px; }
        .info-value { color: var(--text-primary); font-size: 16px; font-weight: 500; }

        /* -------------------- 表单相关 -------------------- */
        .required { color: #e74c3c; }
        .hint { margin-top: 5px; color: var(--text-secondary); font-size: 12px; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 5px; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .action-btns { display: flex; gap: 8px; }
        .form-group input:disabled { background: var(--hover-bg); cursor: not-allowed; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--btn-primary); }

        /* -------------------- 首页 Hero -------------------- */
        .hero {
            min-height: calc(100vh - 120px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 40px; position: relative; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: moveGrid 20s linear infinite;
        }
        @keyframes moveGrid { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }
        .hero-card {
            background: rgba(255, 255, 255, 0.95); border-radius: 24px;
            padding: 60px 80px; text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            position: relative; z-index: 1; backdrop-filter: blur(10px);
            animation: floatIn 0.8s ease-out;
        }
        @keyframes floatIn { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        .hero-icon {
            width: 160px; height: 160px; margin: 0 auto 30px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4); } 50% { box-shadow: 0 15px 60px rgba(102, 126, 234, 0.6); } }
        .hero-icon svg { width: 80px; height: 80px; fill: white; }
        .hero-title {
            font-size: 42px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 15px; letter-spacing: 2px;
        }
        .hero-subtitle { color: #666; font-size: 18px; margin-bottom: 30px; }
        .hero-badges { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .badge { padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .badge-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .badge-success { background: #e8f5e9; color: #27ae60; }
        .badge-warning { background: #fff3e0; color: #ff9800; }
        .floating-shapes { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; overflow: hidden; }
        .shape { position: absolute; border-radius: 50%; opacity: 0.1; }
        .shape-1 { width: 300px; height: 300px; background: white; top: 10%; left: 5%; animation: float 6s ease-in-out infinite; }
        .shape-2 { width: 200px; height: 200px; background: white; bottom: 15%; right: 10%; animation: float 8s ease-in-out infinite reverse; }
        .shape-3 { width: 150px; height: 150px; background: white; top: 60%; left: 15%; animation: float 7s ease-in-out infinite 1s; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }

        /* -------------------- 权限管理页面 -------------------- */
        .page-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; background: var(--hover-bg); color: var(--text-primary); }
        .page-tag.system { background: var(--role-admin-bg); color: var(--role-admin-color); }
        code { background: var(--hover-bg); padding: 2px 6px; border-radius: 3px; font-size: 13px; color: var(--link-color); }

        /* -------------------- 分组详情页 -------------------- */
        .card-header h2 span { color: var(--link-color); }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧导航栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo">📚 门户网站</span>
            </div>
            <nav class="sidebar-nav">
                <!-- 首页 -->
                <div class="nav-item">
                    <a th:href="@{/main}" class="nav-link" th:classappend="${currentPage == 'home'} ? 'active' : ''">
                        <span class="icon">🏠</span>
                        <span class="text">首页</span>
                    </a>
                </div>

                <!-- 后台管理（可展开）- 仅管理员可见 -->
                <div class="nav-item" th:if="${isAdmin == true}">
                    <a class="nav-link" th:classappend="${currentPage == 'users' or currentPage == 'groups' or currentPage == 'permissions'} ? 'active' : ''" onclick="toggleSubmenu('admin-submenu', this)">
                        <span class="icon">⚙️</span>
                        <span class="text">后台管理</span>
                        <span class="arrow">▼</span>
                    </a>
                    <div class="submenu" th:classappend="${currentPage == 'users' or currentPage == 'groups' or currentPage == 'permissions'} ? 'open' : ''" id="admin-submenu">
                        <a th:href="@{/admin/users}" class="nav-link" th:classappend="${currentPage == 'users'} ? 'active' : ''">
                            <span class="icon">👥</span>
                            <span class="text">用户管理</span>
                        </a>
                        <a th:href="@{/admin/groups}" class="nav-link" th:classappend="${currentPage == 'groups'} ? 'active' : ''">
                            <span class="icon">📂</span>
                            <span class="text">分组管理</span>
                        </a>
                        <a th:href="@{/admin/permissions}" class="nav-link" th:classappend="${currentPage == 'permissions'} ? 'active' : ''">
                            <span class="icon">🔐</span>
                            <span class="text">权限管理</span>
                        </a>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <!-- 顶部栏 -->
            <header class="header">
                <div class="header-left">
                    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
                    <span class="header-title" th:text="${pageTitle}">页面标题</span>
                </div>
                <div class="header-right">
                    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                        <span class="theme-icon-light">🌙</span>
                        <span class="theme-icon-dark">☀️</span>
                        <span class="theme-toggle-label">主题</span>
                    </button>
                    <span class="header-user" th:text="'欢迎，' + ${session.loginUser}">欢迎，用户</span>
                    <a th:href="@{/logout}" class="header-logout">退出登录</a>
                </div>
            </header>

            <!-- 主内容 -->
            <main class="main-content">
                <!-- 提示信息 -->
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

                <!-- 页面内容 — 由 content 参数注入 -->
                <th:block th:replace="${content}" />
            </main>
        </div>
    </div>

    <script>
        // 主题初始化：优先读取 localStorage，其次跟随系统
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();

        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function toggleSubmenu(id, element) {
            var submenu = document.getElementById(id);
            var arrow = element.querySelector('.arrow');
            if (submenu.classList.contains('open')) {
                submenu.classList.remove('open');
                arrow.style.transform = 'rotate(0deg)';
            } else {
                submenu.classList.add('open');
                arrow.style.transform = 'rotate(180deg)';
            }
        }

        function toggleSidebar() {
            var sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        /* ==================== 模态框函数（各页面共享） ==================== */
        function showCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }
        function hideCreateModal() {
            document.getElementById('createModal').style.display = 'none';
        }
        document.getElementById('createModal') && document.getElementById('createModal').addEventListener('click', function(e) {
            if (e.target === this) hideCreateModal();
        });

        function showEditModal(btn) {
            document.getElementById('editGroupId').value = btn.getAttribute('data-id');
            document.getElementById('editGroupName').value = btn.getAttribute('data-name');
            document.getElementById('editGroupDesc').value = btn.getAttribute('data-desc') || '';
            document.getElementById('editModal').style.display = 'flex';
        }
        function hideEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        document.getElementById('editModal') && document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) hideEditModal();
        });

        function showAddPageModal() {
            document.getElementById('addPageModal').style.display = 'flex';
        }
        function hideAddPageModal() {
            document.getElementById('addPageModal').style.display = 'none';
        }
        document.getElementById('addPageModal') && document.getElementById('addPageModal').addEventListener('click', function(e) {
            if (e.target === this) hideAddPageModal();
        });
    </script>
</body>
</html>
