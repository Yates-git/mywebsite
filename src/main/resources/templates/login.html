<!DOCTYPE html>
<!--
    login.html - 登录页面

    Thymeleaf 语法说明：
    - th:text="${变量名}"    : 替换文本内容
    - th:if="${条件}"       : 条件显示
    - th:action="@{/路径}"  : 表单提交地址
    - ${...}                : 从 Model/Controller 获取的数据
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <title>登录</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <!-- 登录框容器 -->
    <div class="login-container">
        <h2>🔐 用户登录</h2>

        <!--
            错误提示 - th:if="${error}" 表示如果有 error 变量就显示
            当 Controller 登录失败时，会返回 error 信息
        -->
        <div th:if="${error}" class="error-msg">
            <span th:text="${error}">错误信息</span>
        </div>

        <!--
            登录表单
            th:action="@{/login}" - 提交到 /login（对应 Controller 的 @PostMapping("/login")）
            method="post"       - POST 请求方式
        -->
        <form th:action="@{/login}" method="post">
            <!-- 用户名输入框 -->
            <div class="input-group">
                <label for="username">用户名</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="请输入用户名"
                       required>
            </div>

            <!-- 密码输入框 -->
            <div class="input-group">
                <label for="password">密码</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="请输入密码"
                       required>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="login-btn">登 录</button>
        </form>
    </div>
</body>
</html>
