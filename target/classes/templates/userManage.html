<!DOCTYPE html>
<!--
    userManage.html - 用户管理页面
    使用：th:replace="~{layout :: layout(pageTitle='用户管理', currentPage='users', content=~{:: .page-content})}"
-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(pageTitle='用户管理', currentPage='users', content=~{:: .page-content})}">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <style>
        .action-btns { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div class="page-content">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="card">
            <div class="card-header">
                <h2>👥 用户管理</h2>
                <a th:href="@{/admin/user/add}" class="btn btn-primary">➕ 添加用户</a>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>所属分组</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">admin</td>
                        <td>
                            <span class="role-tag admin" th:if="${user.isAdmin == 1}">管理员</span>
                            <span class="role-tag user" th:if="${user.isAdmin == 0}">普通用户</span>
                        </td>
                        <td>
                            <span class="status-tag active" th:if="${user.isDeleted == 0}">正常</span>
                            <span class="status-tag deleted" th:if="${user.isDeleted == 1}">禁用</span>
                        </td>
                        <td>
                            <span th:if="${userGroupsMap.get(user.id).size() > 0}">
                                <span th:each="gName : ${userGroupsMap.get(user.id)}">
                                    <span class="group-tag" th:text="${gName}">分组</span>
                                </span>
                            </span>
                            <span th:if="${userGroupsMap.get(user.id).size() == 0}" style="color: #999;">-</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                        <td>
                            <div class="action-btns">
                                <a th:href="@{/admin/user/edit/{id}(id=${user.id})}" class="btn btn-secondary btn-sm">编辑</a>
                                <a th:href="@{/admin/user/delete/{id}(id=${user.id})}" class="btn btn-danger btn-sm"
                                   th:text="${user.isDeleted == 0} ? '禁用' : '恢复'"
                                   onclick="return confirm(this.textContent === '禁用' ? '确定要禁用该用户吗？' : '确定要恢复该用户吗？')">禁用</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7">
                            <div class="empty-state">
                                <div style="font-size: 60px; margin-bottom: 20px;">📭</div>
                                <p>暂无用户数据</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
