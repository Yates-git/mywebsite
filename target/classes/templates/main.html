<!DOCTYPE html>
<!--
    main.html - 主页
    显示登录用户的信息
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" th:href="${faviconLink}" type="image/svg+xml">
    <title>首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f6fa; height: 100vh; overflow: hidden; }
        .layout { display: flex; height: 100vh; }
        .sidebar { width: 240px; background: #2c3e50; color: white; display: flex; flex-direction: column; transition: width 0.3s; overflow: hidden; flex-shrink: 0; }
        .sidebar.collapsed { width: 60px; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; min-height: 60px; }
        .sidebar-header .logo { font-size: 20px; font-weight: bold; white-space: nowrap; }
        .sidebar.collapsed .logo { display: none; }
        .sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; }
        .nav-link { display: flex; align-items: center; padding: 12px 15px; color: rgba(255,255,255,0.7); text-decoration: none; transition: all 0.2s; cursor: pointer; white-space: nowrap; }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .nav-link .icon { font-size: 18px; width: 30px; flex-shrink: 0; text-align: center; }
        .nav-link .text { flex: 1; }
        .nav-link .arrow { font-size: 12px; transition: transform 0.2s; }
        .sidebar.collapsed .nav-link .text, .sidebar.collapsed .nav-link .arrow { display: none; }
        .submenu { display: none; background: rgba(0,0,0,0.2); }
        .submenu.open { display: block; }
        .submenu .nav-link { padding-left: 45px; font-size: 14px; }
        .submenu .nav-link .icon { width: 20px; }
        .header { height: 60px; background: white; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .toggle-sidebar { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; }
        .header-title { font-size: 18px; color: #333; font-weight: 500; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .header-user { color: #666; font-size: 14px; }
        .header-logout { background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 14px; text-decoration: none; }
        .header-logout:hover { background: #c0392b; }
        .main-content { flex: 1; overflow-y: auto; padding: 0; }

        /* Hero Section */
        .hero {
            min-height: calc(100vh - 60px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: moveGrid 20s linear infinite;
        }
        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 30px); }
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 60px 80px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            animation: floatIn 0.8s ease-out;
        }
        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .hero-icon {
            width: 160px;
            height: 160px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4); }
            50% { box-shadow: 0 15px 60px rgba(102, 126, 234, 0.6); }
        }
        .hero-icon svg {
            width: 80px;
            height: 80px;
            fill: white;
        }
        .hero-title {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .hero-subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .hero-badges {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .badge {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .badge-success { background: #e8f5e9; color: #27ae60; }
        .badge-warning { background: #fff3e0; color: #ff9800; }
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        .shape-1 { width: 300px; height: 300px; background: white; top: 10%; left: 5%; animation: float 6s ease-in-out infinite; }
        .shape-2 { width: 200px; height: 200px; background: white; bottom: 15%; right: 10%; animation: float 8s ease-in-out infinite reverse; }
        .shape-3 { width: 150px; height: 150px; background: white; top: 60%; left: 15%; animation: float 7s ease-in-out infinite 1s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧导航栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo">📚 门户网站</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item">
                    <a th:href="@{/main}" class="nav-link active">
                        <span class="icon">🏠</span>
                        <span class="text">首页</span>
                    </a>
                </div>
                <div class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link" onclick="toggleSubmenu('admin-submenu', this)">
                        <span class="icon">⚙️</span>
                        <span class="text">后台管理</span>
                        <span class="arrow">▼</span>
                    </a>
                    <div class="submenu" id="admin-submenu">
                        <a th:href="@{/admin/users}" class="nav-link">
                            <span class="icon">👥</span>
                            <span class="text">用户管理</span>
                        </a>
                        <a th:href="@{/admin/groups}" class="nav-link">
                            <span class="icon">📂</span>
                            <span class="text">分组管理</span>
                        </a>
                        <a th:href="@{/admin/permissions}" class="nav-link">
                            <span class="icon">🔐</span>
                            <span class="text">权限管理</span>
                        </a>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
            <header class="header">
                <div class="header-left">
                    <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
                    <span class="header-title">首页</span>
                </div>
                <div class="header-right">
                    <span class="header-user" th:text="'欢迎，' + ${username}">欢迎，用户</span>
                    <a th:href="@{/logout}" class="header-logout">退出登录</a>
                </div>
            </header>

            <main class="main-content">
                <div class="hero">
                    <div class="floating-shapes">
                        <div class="shape shape-1"></div>
                        <div class="shape shape-2"></div>
                        <div class="shape shape-3"></div>
                    </div>
                    <div class="hero-card">
                        <div class="hero-icon">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                        </div>
                        <h1 class="hero-title">欢迎进入系统</h1>
                        <p class="hero-subtitle">感谢您的登录，当前会话已建立成功</p>
                        <div class="hero-badges">
                            <span class="badge badge-primary">🔐 安全连接</span>
                            <span class="badge badge-success">✅ 已认证</span>
                            <span class="badge badge-warning">🚀 就绪状态</span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function toggleSubmenu(id, element) {
            var submenu = document.getElementById(id);
            var arrow = element.querySelector('.arrow');
            if (submenu.classList.contains('open')) {
                submenu.classList.remove('open');
                arrow.style.transform = 'rotate(0deg)';
            } else {
                submenu.classList.add('open');
                arrow.style.transform = 'rotate(180deg)';
            }
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }
    </script>
</body>
</html>
